<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Tracker</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#064e3b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .emerald-gradient { background: linear-gradient(135deg, #064e3b 0%, #065f46 100%); }
        .expense-card { transition: transform 0.1s; }
        .expense-card:active { transform: scale(0.98); }
        input, select { font-size: 16px !important; } /* Prevents iOS zoom on focus */
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const WELCOME_MESSAGES = [
            "Assalamu Alaikum! Let's track your wealth.",
            "Bismillah! Every cent counted is a cent saved.",
            "Welcome back! Prosperity begins with discipline.",
            "Habibi, track your spending today for a better tomorrow.",
            "Keep going! Small savings lead to big dreams.",
            "Marhaba! Time to balance the books.",
            "Success starts with awareness. You've got this!"
        ];

        const WEALTH_QUOTES = [
            "Wealth is not about having much, but being content.",
            "A penny saved is a penny earned.",
            "The best richness is the richness of the soul.",
            "Do not save what is left after spending; spend what is left after saving.",
            "Budgeting tells your money where to go instead of wondering where it went.",
            "Small leaks can sink a great ship. Watch your expenses.",
            "Financial freedom is available to those who learn about it and work for it."
        ];

        function App() {
            const [expenses, setExpenses] = useState(() => {
                const saved = localStorage.getItem('dailyTracker_v1');
                return saved ? JSON.parse(saved) : [];
            });

            const [rate, setRate] = useState(() => {
                const saved = localStorage.getItem('dailyTracker_rate');
                return saved ? parseFloat(saved) : 600;
            });

            const [amount, setAmount] = useState('');
            const [currency, setCurrency] = useState('CFA');
            const [note, setNote] = useState('');
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);

            const welcomeMsg = useMemo(() => WELCOME_MESSAGES[new Date().getDate() % WELCOME_MESSAGES.length], []);
            const quoteMsg = useMemo(() => WEALTH_QUOTES[new Date().getDate() % WEALTH_QUOTES.length], []);

            useEffect(() => {
                localStorage.setItem('dailyTracker_v1', JSON.stringify(expenses));
            }, [expenses]);

            useEffect(() => {
                localStorage.setItem('dailyTracker_rate', rate.toString());
            }, [rate]);

            const addExpense = () => {
                if (!amount || parseFloat(amount) <= 0) return;
                
                const newExpense = {
                    id: Date.now(),
                    amount: parseFloat(amount),
                    currency,
                    note: note || 'General',
                    date,
                    monthLabel: date.substring(0, 7) // YYYY-MM
                };

                setExpenses([newExpense, ...expenses]);
                setAmount('');
                setNote('');
            };

            const deleteExpense = (id) => {
                if(confirm("Delete this record?")) {
                    setExpenses(expenses.filter(e => e.id !== id));
                }
            };

            const resetData = () => {
                const pwd = prompt("Enter password to reset all data:");
                if (pwd === "2007") {
                    setExpenses([]);
                    alert("Database cleared.");
                } else {
                    alert("Incorrect password.");
                }
            };

            // Grouping logic
            const grouped = expenses.reduce((acc, exp) => {
                if (!acc[exp.monthLabel]) acc[exp.monthLabel] = [];
                acc[exp.monthLabel].push(exp);
                return acc;
            }, {});

            const sortedMonths = Object.keys(grouped).sort().reverse();

            const calculateMonthTotals = (monthExpenses) => {
                let totalCFA = 0;
                let totalUSD = 0;

                monthExpenses.forEach(e => {
                    if (e.currency === 'CFA') {
                        totalCFA += e.amount;
                        totalUSD += (e.amount / rate);
                    } else {
                        totalUSD += e.amount;
                        totalCFA += (e.amount * rate);
                    }
                });

                return { cfa: totalCFA.toLocaleString(), usd: totalUSD.toFixed(2) };
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col pb-10">
                    {/* Header */}
                    <header className="emerald-gradient text-white p-6 rounded-b-3xl shadow-lg">
                        <h1 className="text-xl font-bold opacity-90">{welcomeMsg}</h1>
                        <p className="text-sm opacity-75 mt-1">Daily Expense Tracker</p>
                        
                        <div className="mt-6 bg-white/10 p-4 rounded-xl backdrop-blur-sm border border-white/20">
                            <label className="block text-xs uppercase tracking-wider font-semibold opacity-80">Exchange Rate (1 USD to CFA)</label>
                            <input 
                                type="number" 
                                value={rate}
                                onChange={(e) => setRate(parseFloat(e.target.value) || 0)}
                                className="bg-transparent text-2xl font-bold w-full outline-none mt-1"
                            />
                        </div>
                    </header>

                    {/* Entry Form */}
                    <main className="p-4 -mt-4">
                        <div className="bg-white rounded-2xl shadow-md p-5 border border-slate-100">
                            <div className="grid grid-cols-2 gap-3 mb-3">
                                <div>
                                    <label className="text-[10px] text-slate-400 uppercase font-bold">Amount</label>
                                    <input 
                                        type="number" 
                                        value={amount}
                                        onChange={(e) => setAmount(e.target.value)}
                                        placeholder="0.00"
                                        className="w-full border-b-2 border-slate-100 py-2 outline-none focus:border-emerald-500 transition-colors"
                                    />
                                </div>
                                <div>
                                    <label className="text-[10px] text-slate-400 uppercase font-bold">Currency</label>
                                    <select 
                                        value={currency}
                                        onChange={(e) => setCurrency(e.target.value)}
                                        className="w-full border-b-2 border-slate-100 py-2 outline-none bg-white"
                                    >
                                        <option value="CFA">CFA</option>
                                        <option value="USD">USD ($)</option>
                                    </select>
                                </div>
                            </div>

                            <div className="mb-4">
                                <label className="text-[10px] text-slate-400 uppercase font-bold">Note / Description</label>
                                <input 
                                    type="text" 
                                    value={note}
                                    onChange={(e) => setNote(e.target.value)}
                                    placeholder="Food, Rent, Salary..."
                                    className="w-full border-b-2 border-slate-100 py-2 outline-none focus:border-emerald-500 transition-colors"
                                />
                            </div>

                            <div className="mb-6">
                                <label className="text-[10px] text-slate-400 uppercase font-bold">Date</label>
                                <input 
                                    type="date" 
                                    value={date}
                                    onChange={(e) => setDate(e.target.value)}
                                    className="w-full border-b-2 border-slate-100 py-2 outline-none"
                                />
                            </div>

                            <button 
                                onClick={addExpense}
                                className="w-full emerald-gradient text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-transform"
                            >
                                SAVE EXPENSE
                            </button>
                        </div>

                        {/* History List */}
                        <div className="mt-8">
                            <h2 className="text-slate-500 text-xs font-bold uppercase tracking-widest mb-4 px-2">History</h2>
                            
                            {sortedMonths.length === 0 && (
                                <div className="text-center py-10 text-slate-400 italic text-sm">
                                    No records found yet.
                                </div>
                            )}

                            {sortedMonths.map(month => {
                                const monthTotals = calculateMonthTotals(grouped[month]);
                                const displayMonth = new Date(month + "-02").toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                                
                                return (
                                    <details key={month} className="mb-4 group bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden" open>
                                        <summary className="list-none p-4 flex justify-between items-center cursor-pointer bg-slate-50/50">
                                            <div>
                                                <h3 className="font-bold text-slate-800">{displayMonth}</h3>
                                                <div className="flex gap-3 mt-1">
                                                    <span className="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">{monthTotals.cfa} CFA</span>
                                                    <span className="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold">${monthTotals.usd}</span>
                                                </div>
                                            </div>
                                            <div className="text-slate-300 group-open:rotate-180 transition-transform">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                                            </div>
                                        </summary>
                                        
                                        <div className="p-2 border-t border-slate-50">
                                            {grouped[month].map(exp => (
                                                <div key={exp.id} className="flex justify-between items-center p-3 border-b border-slate-50 last:border-0 expense-card">
                                                    <div>
                                                        <div className="font-semibold text-slate-700">{exp.note}</div>
                                                        <div className="text-[10px] text-slate-400">{new Date(exp.date).toLocaleDateString()}</div>
                                                    </div>
                                                    <div className="flex items-center gap-4">
                                                        <div className="text-right">
                                                            <div className="font-bold text-slate-900">{exp.amount.toLocaleString()} {exp.currency}</div>
                                                            <div className="text-[9px] text-slate-400">
                                                                {exp.currency === 'CFA' ? `$${(exp.amount/rate).toFixed(2)}` : `${(exp.amount*rate).toLocaleString()} CFA`}
                                                            </div>
                                                        </div>
                                                        <button onClick={() => deleteExpense(exp.id)} className="text-red-200 hover:text-red-500 p-1">
                                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </details>
                                );
                            })}
                        </div>

                        <button 
                            onClick={resetData}
                            className="w-full mt-10 py-3 text-xs font-bold text-red-300 hover:text-red-600 transition-colors tracking-widest"
                        >
                            RESET ENTIRE DATABASE
                        </button>
                    </main>

                    {/* Footer Quote */}
                    <footer className="mt-auto p-8 text-center">
                        <div className="w-10 h-1 bg-emerald-200 mx-auto mb-4 rounded-full"></div>
                        <p className="text-slate-400 italic text-sm px-4">
                            "{quoteMsg}"
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // --- NEW: SERVICE WORKER REGISTRATION ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('SW registration failed', err));
            });
        }
    </script>
</body>
</html>
